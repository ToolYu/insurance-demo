services:
  - type: web
    name: insurance-analyzer-api
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Optional: leave unset when users enter their own API key in the web UI.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: ENABLE_OCR
        value: "true"
